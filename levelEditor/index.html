<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Level Editor</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #222;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 24px;
  }

  #grid {
    display: grid;
    grid-template-columns: repeat(16, 24px);
    grid-template-rows: repeat(16, 24px);
    gap: 1px;
    background: #444;
    border: 1px solid #444;
  }

  .cell {
    width: 24px;
    height: 24px;
    background: #111;
    cursor: pointer;
    display: block;
    touch-action: none;
    user-select: none;
  }

  .cell.white {
    background: #eee;
  }

  /* Path tiles paint their own surface in the svg, so a turn can taper
     instead of filling its whole square. */

  .cell svg {
    display: block;
  }

  .palette {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .swatch {
    width: 28px;
    height: 28px;
    border: 2px solid #555;
    border-radius: 4px;
    cursor: pointer;
    padding: 0;
  }

  .swatch.selected {
    border-color: #fff;
  }

  .swatch.white {
    background: #eee;
  }

  .swatch.path {
    background: #2f4364;
    background-image: linear-gradient(#e0453c 0 3px, transparent 3px calc(100% - 3px), #4b9cf5 calc(100% - 3px) 100%);
  }

  /* Fixed-width so the readout appearing and clearing doesn't shift the page. */
  #coords {
    font-family: monospace;
    font-size: 13px;
    color: #aaa;
    background: #111;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 4px 8px;
    min-width: 8ch;
    text-align: center;
  }

  .hint {
    font-size: 12px;
    color: #888;
  }

  #reverse {
    font: inherit;
    font-size: 13px;
    padding: 4px 10px;
    background: #333;
    color: #eee;
    border: 1px solid #555;
    border-radius: 4px;
    cursor: pointer;
  }

  .ascii-row {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }

  /* Value is a single unbroken line; the box is sized to exactly 16 chars so
     it soft-wraps back into the 16x16 shape on screen. */
  #ascii {
    font-family: monospace;
    font-size: 14px;
    line-height: 1.15;
    width: 16ch;
    padding: 4px 6px;
    resize: none;
    overflow: hidden;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    background: #111;
    color: #eee;
    border: 1px solid #555;
  }

  #ascii-byte-count {
    font-size: 12px;
    color: #aaa;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <h1>Level Editor</h1>

  <div class="palette">
    <span>Paint:</span>
    <button class="swatch white selected" data-value="1" title="White (/)"></button>
    <button class="swatch path" data-value="2" title="Path"></button>
    <button id="reverse">Reverse all paths</button>
    <span class="hint">right-click a path to reverse just that one</span>
  </div>

  <div id="grid"></div>

  <div id="coords"></div>

  <div class="ascii-row">
    <label for="ascii">ASCII:</label>
    <textarea id="ascii" rows="16" spellcheck="false" autocomplete="off"></textarea>
    <span id="ascii-byte-count"></span>
  </div>

  <script src="main.js"></script>
</body>
</html>
